# yaml-language-server: $schema=https://json.schemastore.org/spring-boot

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

logging:
  level:
    org.springframework.web: DEBUG
    com.rideon: DEBUG

application:
  api:
    prefix: /api/v1
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-ms: 86400000
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:test}
    api-key: ${CLOUDINARY_API_KEY:test}
    api-secret: ${CLOUDINARY_API_SECRET:test}